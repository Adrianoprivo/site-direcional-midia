<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Privo Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Privo Post — mini sistema: menu lateral (expande/recolhe), áreas por canal, abas por perfil. Ver post/docs/spec.md */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --side:#FBFBFC; --sunk:#EEF1F4; --hover:#F1F3F6; --line:#E3E7EC; --line2:#D5DBE2;
  --ink:#141A22; --ink2:#3B4654; --muted:#6B7684;
  --accent:#0B6477; --accent-ink:#FFFFFF; --accent-soft:#E2F0F2;
  --bad:#C2303F; --bad-soft:#FBE7EA; --ok:#0E8A5C; --ok-soft:#E1F4EB; --warn:#8A5A00; --warn-soft:#FBF0DA;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --wside:248px; --shadow:0 12px 32px rgb(15 25 40 / .14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#151A21; --side:#12161C; --sunk:#1C222B; --hover:#1A2028; --line:#242C36; --line2:#2E3743;
  --ink:#E6EAEF; --ink2:#C3CBD5; --muted:#8C97A5; --accent:#4CB8CB; --accent-ink:#06181C; --accent-soft:#13313A;
  --bad:#F0606F; --bad-soft:#3A1D23; --ok:#2DBB85; --ok-soft:#12302A; --warn:#E9B44C; --warn-soft:#382D14; --shadow:0 12px 34px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#151A21; --side:#12161C; --sunk:#1C222B; --hover:#1A2028; --line:#242C36; --line2:#2E3743;
  --ink:#E6EAEF; --ink2:#C3CBD5; --muted:#8C97A5; --accent:#4CB8CB; --accent-ink:#06181C; --accent-soft:#13313A;
  --bad:#F0606F; --bad-soft:#3A1D23; --ok:#2DBB85; --ok-soft:#12302A; --warn:#E9B44C; --warn-soft:#382D14; --shadow:0 12px 34px rgb(0 0 0 / .5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.dica{position:relative;display:inline-flex;vertical-align:middle;margin-left:4px;cursor:help;outline:none}
.dica .ib{width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:700 10px/1 var(--f-body);font-style:italic;opacity:.55}
.dica:hover .ib,.dica:focus-visible .ib{opacity:1;color:var(--accent)}
.dica .dbox{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:280px;background:var(--ink);color:var(--surface);font:500 12px/1.45 var(--f-body);text-align:left;white-space:normal;letter-spacing:0;text-transform:none;padding:9px 11px;border-radius:8px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:opacity .12s;z-index:80;pointer-events:none}
.dica:hover .dbox,.dica:focus .dbox,.dica:focus-within .dbox{opacity:1;visibility:visible}
.dica.dir .dbox{left:auto;right:-8px;transform:none}
.dica.esq .dbox{left:-8px;transform:none}
.dica.baixo .dbox{bottom:auto;top:calc(100% + 8px)}

/* ---------- casca ---------- */
.shell{display:grid;grid-template-columns:var(--wside) minmax(0,1fr);min-height:100vh}
.shell.mini{--wside:60px}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;min-height:44px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;font-size:14px;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 8px 4px}
.ni{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;padding:7px 8px;text-align:left;color:var(--ink2);text-decoration:none;font-weight:500;min-height:34px}
.ni:hover{background:var(--hover);color:var(--ink)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.ni .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .chev{width:14px;height:14px;transition:transform .15s;opacity:.7}
.ni[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ni .dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.ni .dot.on{background:var(--ok)}
.sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px 17px;padding-left:11px;border-left:1px solid var(--line)}
.sub .ni{font-size:13px;min-height:30px;padding:5px 8px}
.sub .grp{font-size:11px;color:var(--muted);padding:8px 8px 2px;font-weight:600}
.sub .tag{font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--warn-soft);color:var(--warn);flex:none}
.sidefoot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.who{font-size:12px;color:var(--muted);padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:60}
.shell.mini .side{padding-left:10px;padding-right:10px}
.shell.mini .brand div,.shell.mini .ni .lbl,.shell.mini .ni .chev,.shell.mini .nav .sec,.shell.mini .sub,.shell.mini .who,.shell.mini .ni .dot{display:none}
.shell.mini .ni{justify-content:center;padding:8px}
.shell.mini .ni:hover .tip{opacity:1}
.shell.mini .brand{justify-content:center;padding:4px 0 14px}
.shell.mini .side{overflow:visible}
.shell.mini .toggle svg{transform:rotate(180deg)}

/* ---------- área principal ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 24px 10px;min-height:52px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;flex:1}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span,.crumb a{white-space:nowrap}
.crumb a{color:var(--muted);text-decoration:none;border-radius:6px;padding:2px 4px;margin:0 -4px}
.crumb a:hover{color:var(--ink);background:var(--hover)}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;place-items:center}
.content{padding:24px;max-width:1180px;width:100%}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:9px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card+.card{margin-top:16px}
.grid>.card+.card{margin-top:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:14px;font-weight:600}
.ch p{margin:0;color:var(--muted);font-size:12px}
.cb{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default}
.muted{color:var(--muted)}
.msg{border-radius:8px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.prof{display:flex;gap:16px;align-items:flex-start}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--sunk);flex:none;border:1px solid var(--line)}
.prof h3{margin:0;font-size:16px}
.bio{white-space:pre-line;margin:8px 0 0;color:var(--ink2)}
.stats{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap}
.stats b{display:block;font-size:16px}
.stats span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--side)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
.thumb{width:40px;height:50px;border-radius:6px;object-fit:cover;background:var(--sunk);display:block}
.cap{max-width:280px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.list .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row b{display:block;font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.filtros{display:flex;gap:10px;flex-wrap:wrap}
.filtros label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.filtros select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
th.ord button{all:unset;cursor:pointer;font:inherit;color:inherit;font-weight:600}
th.ord button:hover{color:var(--ink)}
th.ord button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.periodo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.periodo select,.periodo input[type=date]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
.periodo .muted{font-size:12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer}
.kgrid.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi2{background:var(--surface);padding:12px 14px}
.kpi2 .l{font-size:12px;color:var(--muted)}
.kpi2 .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi2 .s{font-size:12px;margin-top:2px}
.dl{font-weight:600;font-size:12px;white-space:nowrap}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
.tagx{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.prof .stats{margin-top:0;flex:none}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);font-size:12px}
.pager{display:flex;gap:4px}
.pb{width:30px;height:28px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;font-size:17px;line-height:1;color:var(--ink)}
.pb:hover:not([disabled]){background:var(--hover)}.pb[disabled]{opacity:.35;cursor:default}
.thbtn,.lnk{all:unset;cursor:pointer}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:2px;display:block;overflow:hidden;text-overflow:ellipsis}
.thbtn:focus-visible,.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.bc{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.bimg{all:unset;cursor:pointer;position:relative;display:block;aspect-ratio:4/5;background:var(--sunk)}
.bimg img{width:100%;height:100%;object-fit:cover;display:block}
.bimg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rank{position:absolute;top:8px;left:8px;background:rgb(0 0 0 / .65);color:#fff;font-weight:700;font-size:12px;border-radius:999px;padding:2px 8px}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;text-shadow:0 2px 12px rgb(0 0 0 / .5);pointer-events:none}
.bb{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.row1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.be{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.bl{font-size:12px;color:var(--muted);margin-top:-4px}
.leg{margin:4px 0 0;font-size:12px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;margin:6px 0 0;font-size:12px}
.bm dt{font-size:11px;color:var(--muted)}.bm dd{margin:0;font-weight:600}
.why{font-size:11px;color:var(--ink2);margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line)}
dialog.ver{border:0;padding:0;background:transparent;max-width:min(1000px,96vw);width:100%}
dialog.ver::backdrop{background:rgb(0 0 0 / .7)}
.vbox{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);background:var(--surface);border-radius:12px;overflow:hidden;max-height:90vh}
.vmid{position:relative;background:#000;display:grid;place-items:center;min-height:360px}
.vmid video,.vmid img{width:100%;height:100%;max-height:90vh;object-fit:contain;display:block}
.vmid .muted{color:#ccc}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgb(255 255 255 / .85);color:#111;font-size:24px;line-height:1}
.vnav.l{left:10px}.vnav.r{right:10px}.vnav[disabled]{opacity:.3}
.vcount{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgb(0 0 0 / .6);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
.vside{padding:16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.vx{border:0;background:transparent;font-size:18px;color:var(--muted);width:32px;height:32px;border-radius:8px}
.vx:hover{background:var(--hover);color:var(--ink)}
.vleg{white-space:pre-line;font-size:13px;color:var(--ink2);margin:10px 0;flex:1}
.cf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:center}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.login label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.login input{font:inherit;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 11px}
.login input:focus{outline:2px solid var(--accent);outline-offset:1px}
.login .err{color:var(--bad);min-height:1.2em;margin:0;font-size:13px}
.login .btn{justify-content:center;padding:10px}

/* ---------- celular ---------- */
.scrim{display:none}
@media (max-width:860px){
  .dica .dbox,.dica.dir .dbox,.dica.esq .dbox,.dica.baixo .dbox{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto;max-width:none;transform:none;font-size:13px;padding:12px 14px}
  .shell,.shell.mini{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:272px;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .shell.open .side{transform:none}
  .shell.mini .brand div,.shell.mini .ni .lbl,.shell.mini .ni .chev,.shell.mini .nav .sec,.shell.mini .sub,.shell.mini .who,.shell.mini .ni .dot{display:revert}
  .shell.mini .ni{justify-content:flex-start;padding:7px 8px}
  .toggle{display:none!important}
  .scrim{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .shell.open .scrim{opacity:1;pointer-events:auto}
  .burger{display:grid}
  .top{padding-left:16px;padding-right:16px}
  .content{padding:16px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1fr)}
  .prof{flex-direction:column}
  .kgrid,.kgrid.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kgrid.k5>:last-child{grid-column:1/-1}
  .best{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .vbox{grid-template-columns:minmax(0,1fr);overflow-y:auto}
  .vmid{min-height:280px}
  .cap{max-width:120px}
  th,td{padding:9px 8px}
  .crumb span,.crumb a{display:none}
  .ch{flex-wrap:wrap}
}
</style></head>
<body>
<div class="login" id="login" hidden><form id="lg-form">
  <div class="brand" style="padding:0"><span class="logo">PP</span><div><b>Privo Post</b><small>Direcional Mídia</small></div></div>
  <label>E-mail<input id="lg-email" type="email" autocomplete="username" required></label>
  <label>Senha<input id="lg-pass" type="password" autocomplete="current-password" required></label>
  <p class="err" id="lg-msg" role="alert"></p><button class="btn pri" id="lg-btn" type="submit">Entrar</button></form></div>

<div class="shell" id="shell" hidden>
  <aside class="side" id="side" aria-label="Menu principal"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top"><button class="burger" id="burger" type="button" aria-label="Abrir menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="crumb" id="crumb" aria-label="Você está em"></nav><div id="topact"></div></header>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

/* ---- período (IG-PER-01): mesmas opções do Gerenciador de Anúncios; "últimos N dias" sem contar hoje ---- */
const PRESETS=[['hoje','Hoje'],['ontem','Ontem'],['7','Últimos 7 dias'],['14','Últimos 14 dias'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['semana','Esta semana'],['semana_passada','Semana passada'],['mes','Este mês'],['mes_passado','Mês passado'],['max','Máximo'],['custom','Personalizado']];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dia0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const soma=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function intervalo(p,limiteDias){const h=dia0(new Date());let de,ate;
  const seg=soma(h,-((h.getDay()+6)%7)); // semana começa na segunda
  switch(p.preset){
    case 'hoje':de=ate=h;break; case 'ontem':de=ate=soma(h,-1);break;
    case '7':case '14':case '30':case '90':de=soma(h,-Number(p.preset));ate=soma(h,-1);break;
    case 'semana':de=seg;ate=h;break; case 'semana_passada':de=soma(seg,-7);ate=soma(seg,-1);break;
    case 'mes':de=new Date(h.getFullYear(),h.getMonth(),1);ate=h;break;
    case 'mes_passado':de=new Date(h.getFullYear(),h.getMonth()-1,1);ate=new Date(h.getFullYear(),h.getMonth(),0);break;
    case 'max':de=limiteDias?soma(h,-limiteDias):new Date(2000,0,1);ate=h;break;
    case 'custom':de=p.de?new Date(p.de+'T00:00:00'):soma(h,-7);ate=p.ate?new Date(p.ate+'T00:00:00'):soma(h,-1);break;
  }
  if(limiteDias&&de<soma(h,-limiteDias))de=soma(h,-limiteDias);
  if(ate<de)ate=de;
  const n=Math.round((ate-de)/864e5)+1;
  return {de,ate,n,ant:{de:soma(de,-n),ate:soma(de,-1)}};
}
const fmtI=i=>i.n===1?dataBR(iso(i.de)):`${dataBR(iso(i.de))} a ${dataBR(iso(i.ate))}`;

    ${p.preset==='custom'?`<input type="date" data-p="de" value="${iso(i.de)}" aria-label="De"><input type="date" data-p="ate" value="${iso(i.ate)}" aria-label="Até">`:`<span class="muted">${esc(fmtI(i))}</span>`}
    <label class="chk"><input type="checkbox" data-p="comparar"${p.comparar?' checked':''}> Comparar com período anterior</label></div>`}

  const pegarTend=async()=>{if(!S.igConta)S.igConta=await api('ig-api',{acao:'conta'});return S.igConta};
  pegarPer().then(r=>{const a=r.atual,b=r.anterior;const aprox=new Set(a.aproximado||[]);
    $('kpis').innerHTML=`<div class="kgrid">${KPI.map(([k,l])=>`<div class="kpi2"><div class="l">${l}${aprox.has(k)?' ≈'+dica(D.aprox):''}</div>
      <div class="v num">${num(a.m[k])}</div><div class="s">${b?`${delta(a.m[k],b.m[k])} <span class="muted">vs ${num(b.m[k])}</span>`:'&nbsp;'}</div></div>`).join('')}</div>
      ${b?`<p class="note" style="margin-bottom:0">Comparado com ${esc(fmtI({de:new Date(b.de+'T00:00:00'),ate:new Date(b.ate+'T00:00:00'),n:b.dias}))}.</p>`:''}`;
    const fm=Object.entries(a.formatos||{});
    $('fmt').innerHTML=fm.length?`<div class="tw"><table><thead><tr><th>Formato</th><th class="n">Visualiz.</th><th class="n">Alcance</th><th class="n">Interações</th><th class="n">Curtidas</th><th class="n">Coment.</th><th class="n">Compart.</th><th class="n">Salvos</th></tr></thead>
      <tbody>${fm.sort((x,y)=>(y[1].views||0)-(x[1].views||0)).map(([t,m])=>`<tr><td>${esc(FMT[t]||t)}</td>${['views','reach','total_interactions','likes','comments','shares','saves'].map(k=>`<td class="n num">${num(m[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
      :'<div class="empty">O Instagram não informou números por formato para esse período.</div>'})
   .catch(e=>{$('kpis').innerHTML=aviso('bad',e.message);$('fmt').innerHTML=''});
  pegarTend().then(r=>tabelaTend(r.periodos)).catch(e=>{$('tend').innerHTML=`<div class="cb">${aviso('bad',e.message)}</div>`});
}
function tabelaTend(periodos){const [d7,d14,d30]=periodos;
  const linhas=MC.map(([k,l])=>{const a=d7.m[k],c=d30.m[k];const pouco=c!=null&&c<10;const t=!pouco&&a!=null&&c?((a/7)/(c/30)-1)*100:null;return {k,l,v7:a,v14:d14.m[k],v30:c,t,pouco}});
  const val=(x)=>({nome:x.l,v7:x.v7??-1,v14:x.v14??-1,v30:x.v30??-1,tend:x.t??-1e9})[OT.ord];
  linhas.sort((x,y)=>{const a=val(x),b=val(y);return (typeof a==='string'?a.localeCompare(b):a-b)*OT.dir});
  const H=[['nome','Métrica',''],['v7','Últimos 7 dias','n'],['v14','Últimos 14 dias','n'],['v30','Últimos 30 dias','n'],['tend','Tendência','n']];
  $('tend').innerHTML=`<div class="tw"><table><thead><tr>${H.map(([k,l,c])=>`<th class="${c} ord"><button type="button" data-ot="${k}">${l}${OT.ord===k?(OT.dir<0?' ↓':' ↑'):''}</button>${k==='tend'?dica(D.tend,'dir baixo'):''}</th>`).join('')}</tr></thead>
    <tbody>${linhas.map(x=>`<tr><td>${x.l}</td><td class="n num">${num(x.v7)}</td><td class="n num">${num(x.v14)}</td><td class="n num">${num(x.v30)}</td>
    <td class="n">${x.pouco?'<span class="muted">pouco volume</span>':x.t==null?'<span class="muted">—</span>':`<span class="dl ${x.t>0?'up':x.t<0?'down':''}">${x.t>0?'▲':x.t<0?'▼':''} ${Math.abs(x.t).toLocaleString('pt-BR',{maximumFractionDigits:0})}%</span>`}</td></tr>`).join('')}</tbody></table></div>
`;
  $('tend').querySelectorAll('[data-ot]').forEach(b=>b.onclick=()=>{const k=b.dataset.ot;if(OT.ord===k)OT.dir*=-1;else{OT.ord=k;OT.dir=k==='nome'?1:-1}store.set('pp-otend',JSON.stringify(OT));tabelaTend(periodos)});
}

/* ---- Métricas por post (IG-MET-01..03, 05, 08) ---- */
/* IG-MET-10 (padrão de mercado, igual à mLabs):
   Taxa de engajamento     = (curtidas + comentários + compartilhamentos + salvos) ÷ alcance × 100   (relatórios mLabs / Meta)
   Taxa de engajamento pública = (curtidas + comentários) ÷ seguidores × 100                       (Social Blade / concorrentes)
   Alcance menor que as curtidas é impossível: o Instagram não informa alcance confiável para posts antigos (até jun/2024). */
const CORTE_ALCANCE='2024-08-01'; // antes disso a API devolve alcance muito baixo (ex.: 127 visualizações e 17 de alcance)
const confiavel=m=>m&&!m._antigo&&m.reach!=null&&m.reach>0&&m.reach>=(m.likes||0);
const anotar=l=>{l.forEach(x=>{if(x.metricas)x.metricas._antigo=x.data<CORTE_ALCANCE});return l};
const chaveTipo=x=>x.tipo==='REELS'||x.tipo==='STORY'?x.tipo:(x.formato||x.tipo);
const rotulo=x=>x?(TIPO[chaveTipo(x)]||chaveTipo(x)||''):'';
const pontos=m=>(m.likes||0)+(m.comments||0)+(m.shares||0)+(m.saved||0);
const engaj=m=>confiavel(m)?pontos(m)/m.reach*100:null;
const seg=()=>S.igPerfil&&S.igPerfil.seguidores;
const engPub=m=>seg()?((m.likes||0)+(m.comments||0))/seg()*100:null;
const COLS=[['data','Data'],['views','Visualiz.'],['reach','Alcance'],['likes','Curtidas'],['comments','Coment.'],['shares','Compart.'],['saved','Salvos'],['eng','Tx. engaj.'],['pub','Tx. pública']];
const F=JSON.parse(store.get('pp-fpost')||'{"ord":"data","dir":-1,"tipo":""}');
function salvarF(){store.set('pp-fpost',JSON.stringify(F))}
function valor(x,k){if(k==='data')return new Date(x.data).getTime();if(k==='eng')return engaj(x.metricas)??-1;if(k==='pub')return engPub(x.metricas)??-1;return (x.metricas||{})[k]??-1}
const POR_PAG=12;let pagina=0;
const D={
  tx:'Taxa de engajamento = (curtidas + comentários + compartilhamentos + salvos) ÷ alcance × 100. Mesma conta dos relatórios da mLabs. No período: soma das interações ÷ soma do alcance.',
  pub:'Taxa de engajamento pública = (curtidas + comentários) ÷ seguidores × 100. Padrão do Social Blade, serve para comparar com outros perfis. Média de mercado (mLabs): 0,36%.',
  pubPerfil:'Média de curtidas + comentários dos 12 posts mais recentes ÷ seguidores × 100. Mesma conta do Social Blade.',
  alc:'Pessoas diferentes que viram o post. Posts publicados até julho de 2024 têm alcance não confiável na API do Instagram (às vezes menor que as curtidas) e ficam fora da taxa de engajamento.',
  naoconf:'Alcance não confiável: post de antes de agosto de 2024 ou alcance menor que as curtidas. A taxa pública continua valendo.',
  comp:'Os números de cada post somam desde a publicação. Posts mais novos tiveram menos tempo para juntar resultado.',
  tend:'Média por dia dos últimos 7 dias contra a média por dia dos últimos 30. ▲ = rendendo mais agora. “Pouco volume” = menos de 10 nos 30 dias, cedo para ler tendência. Contas alcançadas e engajadas: aproximado.',
  prazo:'Dados do Instagram podem levar até 48 h para fechar. O Instagram guarda as métricas da conta por 90 dias.',
  aprox:'Período maior que 30 dias: o Instagram entrega em blocos de até 30 dias e a mesma pessoa pode contar em mais de um bloco. Número aproximado.',
  max:'No Máximo os posts vêm de 12 em 12. Ordenação e resumo consideram só os posts já carregados.'
};

async function maisUmaPagina(){const r=await api('ig-api',{acao:'posts',depois:S.igPosts.proximo});S.igPosts.lista.push(...anotar(r.posts));S.igPosts.proximo=r.proximo}
async function carregarAte(limite,minimo=0){ // carrega só o necessário: até cobrir a data pedida, ou até ter "minimo" posts
  if(!S.igPosts){const r=await api('ig-api',{acao:'posts'});S.igPosts={lista:anotar(r.posts),proximo:r.proximo}}
  let n=0;while(S.igPosts.proximo&&n<40){const ult=S.igPosts.lista.at(-1);
    const cobriuData=limite?(ult&&new Date(ult.data)<limite):true;const cobriuQtd=S.igPosts.lista.length>=minimo;
    if(cobriuData&&cobriuQtd)break;await maisUmaPagina();n++}}
function resumo(lista){const conf=lista.filter(x=>confiavel(x.metricas));
  const alc=conf.reduce((s,x)=>s+x.metricas.reach,0),pts=conf.reduce((s,x)=>s+pontos(x.metricas),0);
  const melhor=conf.slice().sort((a,b)=>engaj(b.metricas)-engaj(a.metricas))[0];
  const lc=lista.reduce((s,x)=>s+(x.metricas.likes||0)+(x.metricas.comments||0),0);
  return {posts:lista.length,views:lista.reduce((s,x)=>s+(x.metricas.views||0),0),alcance:alc,eng:alc?pts/alc*100:null,pub:lista.length&&seg()?lc/lista.length/seg()*100:null,melhor,semAlcance:lista.length-conf.length}}
const pct=v=>v==null?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:v<10?2:1,maximumFractionDigits:v<10?2:1})+'%';
const dentro=(x,a,b)=>{const d=dia0(new Date(x.data));return d>=a&&d<=b};
/* No "Máximo" os posts vêm de 12 em 12 da API (nada de carregar 1.000 posts de uma vez). Nos outros períodos carrega só o período. */
async function postsDoPeriodo(P,minimoMax){const i=intervalo(P,null);
  if(P.preset==='max')await carregarAte(null,minimoMax);else await carregarAte(P.comparar?i.ant.de:i.de);
  const todos=S.igPosts.lista;const doTipo=todos.filter(x=>!F.tipo||chaveTipo(x)===F.tipo);
  return {i,todos,doTipo,lista:doTipo.filter(x=>P.preset==='max'||dentro(x,i.de,i.ate)),
    ant:P.comparar&&P.preset!=='max'?doTipo.filter(x=>dentro(x,i.ant.de,i.ant.ate)):null}}
async function garantirPerfil(){if(!S.igPerfil)S.igPerfil=await api('ig-api',{acao:'perfil'})}
async function abaPosts(el){
  el.innerHTML=`<p class="muted"><span class="spin"></span> Carregando os posts do período…</p>`;await garantirPerfil();
  const {todos,lista:l0,ant}=await postsDoPeriodo(PP,(pagina+1)*POR_PAG);
  const lista=l0.slice().sort((a,b)=>(valor(a,F.ord)-valor(b,F.ord))*F.dir);
  const max=PP.preset==='max';const total=lista.length;
  const paginas=Math.max(1,Math.ceil(total/POR_PAG))+(max&&S.igPosts.proximo?1:0);
  if(pagina>=paginas)pagina=paginas-1;
  const visiveis=lista.slice(pagina*POR_PAG,(pagina+1)*POR_PAG);
  const R=resumo(lista),RA=ant?resumo(ant):null;
  const tipos=[...new Set(todos.map(chaveTipo))];
  const kp=(l,v,va,fmt=num,d='')=>`<div class="kpi2"><div class="l">${l}${d}</div><div class="v num">${fmt(v)}</div><div class="s">${RA?`${fmt===pct?(v!=null&&va!=null?`<span class="dl ${v>va?'up':v<va?'down':''}">${v>va?'▲':v<va?'▼':''} ${Math.abs(v-va).toLocaleString('pt-BR',{maximumFractionDigits:1})} p.p.</span>`:''):delta(v,va)} <span class="muted">vs ${fmt(va)}</span>`:'&nbsp;'}</div></div>`;
  el.innerHTML=`<section class="card"><div class="ch"><div><h2>Posts publicados no período${max?dica(D.max,'baixo'):''}${RA?dica(D.comp,'baixo'):''}</h2><p>Clique no título da coluna para ordenar.</p></div>
    <div class="filtros">${seletorPeriodo('pp',PP,null)}<label>Tipo <select id="f-tipo"><option value="">Todos</option>${tipos.map(t=>`<option value="${esc(t)}"${F.tipo===t?' selected':''}>${esc(TIPO[t]||t)}</option>`).join('')}</select></label></div></div>
    <div class="cb"><div class="kgrid k5">${kp('Posts',R.posts,RA&&RA.posts)}${kp('Visualizações somadas',R.views,RA&&RA.views)}${kp('Alcance somado',R.alcance,RA&&RA.alcance,num,dica(D.alc))}${kp('Taxa de engajamento',R.eng,RA&&RA.eng,pct,dica(D.tx))}${kp('Taxa de engajamento pública',R.pub,RA&&RA.pub,pct,dica(D.pub,'dir'))}</div>
    ${R.melhor?`<p class="note" style="margin-bottom:0">Melhor post do período, pela taxa de engajamento: <a href="#/instagram/eu/melhores">${esc((R.melhor.legenda||'(sem legenda)').slice(0,60))}</a> · ${pct(engaj(R.melhor.metricas))} · <a href="#/instagram/eu/melhores">ver os melhores</a></p>`:''}
</div>
  <div class="tbar"><span class="muted">${total?`${num(pagina*POR_PAG+1)}–${num(pagina*POR_PAG+visiveis.length)} de ${num(total)}${max&&S.igPosts.proximo?'+':''} posts`:'0 posts'}</span>
    <div class="pager"><button class="pb" id="pg-ant" type="button" aria-label="Página anterior"${pagina===0?' disabled':''}>‹</button><button class="pb" id="pg-prox" type="button" aria-label="Próxima página"${pagina>=paginas-1?' disabled':''}>›</button></div></div>
  ${visiveis.length?`<div class="tw"><table><thead><tr><th></th><th>Post</th><th>Tipo</th>${COLS.map(([k,l])=>`<th class="${k==='data'?'':'n'} ord"><button type="button" data-ord="${k}">${l}${F.ord===k?(F.dir<0?' ↓':' ↑'):''}</button>${k==='eng'?dica(D.tx,'dir baixo'):k==='pub'?dica(D.pub,'dir baixo'):k==='reach'?dica(D.alc,'dir baixo'):''}</th>`).join('')}</tr></thead>
  <tbody>${visiveis.map(x=>{const m=x.metricas||{},e=engaj(m);return `<tr><td><button class="thbtn" type="button" data-ver="${esc(x.id)}" aria-label="Ver o post aqui">${x.capa?`<img class="thumb" src="${esc(x.capa)}" alt="" loading="lazy">`:'<span class="thumb"></span>'}</button></td>
    <td><div class="cap"><button class="lnk" type="button" data-ver="${esc(x.id)}">${esc(x.legenda||'(sem legenda)')}</button></div></td>
    <td>${esc(rotulo(x))}</td><td>${esc(new Date(x.data).toLocaleDateString('pt-BR'))}</td>
    <td class="n num">${num(m.views)}</td><td class="n num">${confiavel(m)?num(m.reach):`<span class="muted">${num(m.reach)}*</span>`}</td><td class="n num">${num(m.likes)}</td><td class="n num">${num(m.comments)}</td><td class="n num">${num(m.shares)}</td><td class="n num">${num(m.saved)}</td>
    <td class="n num">${e==null?`<span class="tagx">não confiável</span>${dica(D.naoconf,'dir')}`:`<b>${pct(e)}</b>`}</td><td class="n num">${pct(engPub(m))}</td></tr>`}).join('')}</tbody></table></div>`
    :'<div class="empty">Nenhum post publicado nesse período.</div>'}
</section>`;
  el.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{const k=b.dataset.ord;if(F.ord===k)F.dir*=-1;else{F.ord=k;F.dir=-1}salvarF();pagina=0;abaPosts(el)});
  $('f-tipo').onchange=e=>{F.tipo=e.target.value;salvarF();pagina=0;abaPosts(el)};
  ligarPeriodo('pp',PP,salvarPP,()=>{pagina=0;abaPosts(el)});
  $('pg-ant').onclick=()=>{pagina--;abaPosts(el)};$('pg-prox').onclick=()=>{pagina++;abaPosts(el)};
  ligarVer(el);
}

/* ---- Melhores posts do período (IG-MET-09): top N pela taxa de engajamento, com o porquê ---- */
const PM=JSON.parse(store.get('pp-pmelhores')||'{"preset":"90","comparar":false,"qtd":6}');
if(!PRESETS.find(p=>p[0]===PM.preset))PM.preset='90';if(![3,6,9,12].includes(Number(PM.qtd)))PM.qtd=6;
const salvarPM=()=>store.set('pp-pmelhores',JSON.stringify(PM));
function porque(m,media){const p=[['likes','curtida'],['comments','comentário'],['shares','compartilhamento'],['saved','salvo']]
  .filter(([k])=>m[k]).map(([k,l])=>`${num(m[k])} ${l}${m[k]>1?'s':''}`);
  const e=engaj(m);const x=media?e/media:null;
  return `${num(pontos(m))} interações (${p.join(', ')||'nenhuma'}) ÷ ${num(m.reach)} de alcance${x&&isFinite(x)?` · <b>${x.toLocaleString('pt-BR',{maximumFractionDigits:1})}× a média do período</b>`:''}`}
async function abaMelhores(el){
  el.innerHTML=`<p class="muted"><span class="spin"></span> Buscando os melhores posts do período…</p>`;await garantirPerfil();
  const {lista}=await postsDoPeriodo({...PM,comparar:false},48);
  const conf=lista.filter(x=>confiavel(x.metricas));
  const R=resumo(lista);const qtd=Number(PM.qtd);
  const top=conf.sort((a,b)=>engaj(b.metricas)-engaj(a.metricas)).slice(0,qtd);
  el.innerHTML=`<section class="card"><div class="ch"><div><h2>Melhores posts do período</h2><p>Até ${qtd} posts com maior taxa de engajamento${dica(D.tx)}. Clique para ver aqui mesmo.</p></div>
    <div class="filtros">${seletorPeriodo('pm',PM,null).replace(/<label class="chk">[\s\S]*?<\/label>/,'')}
      <label>Mostrar <select id="m-qtd">${[3,6,9,12].map(n=>`<option value="${n}"${qtd===n?' selected':''}>${n} posts</option>`).join('')}</select></label></div></div>
    <div class="cb">${top.length?`<p class="note" style="margin:0 0 14px">Taxa do período: <b>${pct(R.eng)}</b> · pública: <b>${pct(R.pub)}</b>${dica(D.pub)} · ${num(conf.length)} post(s) com alcance confiável${dica(D.alc)}${PM.preset==='max'?dica(D.max):''}</p>
    <div class="best">${top.map((x,n)=>{const m=x.metricas;return `<article class="bc"><button class="bimg" type="button" data-ver="${esc(x.id)}" aria-label="Ver o post">${x.capa?`<img src="${esc(x.capa)}" alt="" loading="lazy">`:''}<span class="rank">#${n+1}</span>${x.tipo==='REELS'||x.formato==='VIDEO'?'<span class="play">▶</span>':''}</button>
      <div class="bb"><div class="row1"><span class="pill acc">${esc(rotulo(x))}</span><span class="muted">${esc(new Date(x.data).toLocaleDateString('pt-BR'))}</span></div>
      <div class="be num">${pct(engaj(m))}</div><div class="bl">taxa de engajamento · pública ${pct(engPub(m))}</div>
      <p class="leg">${esc((x.legenda||'(sem legenda)').slice(0,90))}</p>
      <dl class="bm"><div><dt>Visualiz.</dt><dd class="num">${num(m.views)}</dd></div><div><dt>Alcance</dt><dd class="num">${num(m.reach)}</dd></div><div><dt>Curtidas</dt><dd class="num">${num(m.likes)}</dd></div>
      <div><dt>Coment.</dt><dd class="num">${num(m.comments)}</dd></div><div><dt>Compart.</dt><dd class="num">${num(m.shares)}</dd></div><div><dt>Salvos</dt><dd class="num">${num(m.saved)}</dd></div></dl>
      <p class="why"><b>Por que está aqui:</b> ${porque(m,R.eng)}</p></div></article>`}).join('')}</div>`
    :'<div class="empty">Nenhum post com alcance confiável nesse período. Escolha um período maior.</div>'}</div></section>`;
  ligarPeriodo('pm',PM,salvarPM,()=>abaMelhores(el));
  $('m-qtd').onchange=e=>{PM.qtd=Number(e.target.value);salvarPM();abaMelhores(el)};
  ligarVer(el);
}

/* ---- Visualizador dentro da página (vídeo toca aqui; carrossel passa foto a foto) ---- */
function ligarVer(el){el.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>abrirPost(b.dataset.ver))}
async function abrirPost(id){const x=(S.igPosts?.lista||[]).find(p=>p.id===id);const m=x?.metricas||{};
  let d=$('ver');if(!d){d=document.createElement('dialog');d.id='ver';d.className='ver';document.body.appendChild(d);

    <aside class="vside"><div class="row1"><span class="pill acc">${esc(rotulo(x))}</span><span class="muted">${x?esc(new Date(x.data).toLocaleDateString('pt-BR')):''}</span>
      <button class="vx" type="button" id="vfechar" aria-label="Fechar">✕</button></div>
      <div class="be num">${pct(engaj(m))}</div><div class="bl">taxa de engajamento · pública ${pct(engPub(m))}</div>
      <dl class="bm"><div><dt>Visualiz.</dt><dd class="num">${num(m.views)}</dd></div><div><dt>Alcance</dt><dd class="num">${num(m.reach)}</dd></div><div><dt>Curtidas</dt><dd class="num">${num(m.likes)}</dd></div>
      <div><dt>Coment.</dt><dd class="num">${num(m.comments)}</dd></div><div><dt>Compart.</dt><dd class="num">${num(m.shares)}</dd></div><div><dt>Salvos</dt><dd class="num">${num(m.saved)}</dd></div></dl>
      <p class="vleg">${esc(x?.legenda||'')}</p><a class="btn" href="${esc(x?.link||'#')}" target="_blank" rel="noopener">${ic('ext')} Abrir no Instagram</a></aside></div>`;
  $('vfechar').onclick=()=>d.close();d.showModal();
  try{const r=await api('ig-api',{acao:'midia',id});let k=0;const mid=$('vmid');if(!mid)return;
    const desenhar=()=>{const it=r.itens[k];mid.innerHTML=`${it.tipo==='VIDEO'?`<video src="${esc(it.url)}" ${it.capa?`poster="${esc(it.capa)}"`:''} controls autoplay playsinline></video>`:`<img src="${esc(it.url)}" alt="">`}
      ${r.itens.length>1?`<button class="vnav l" type="button" aria-label="Anterior"${k===0?' disabled':''}>‹</button><button class="vnav r" type="button" aria-label="Próxima"${k===r.itens.length-1?' disabled':''}>›</button><span class="vcount">${k+1} / ${r.itens.length}</span>`:''}`;
      const l=mid.querySelector('.vnav.l'),rr=mid.querySelector('.vnav.r');if(l)l.onclick=()=>{k--;desenhar()};if(rr)rr.onclick=()=>{k++;desenhar()}};
    if(!r.itens.length||!r.itens[0].url){mid.innerHTML='<p class="muted">O Instagram não liberou o arquivo deste post. Use “Abrir no Instagram”.</p>';return}
    desenhar()}
  catch(e){const mid=$('vmid');if(mid)mid.innerHTML=aviso('bad',e.message)}}

/* ---------- Instagram: clientes ---------- */
function vIgClientes(v){crumb([['Instagram','#/instagram/eu/perfil'],'Clientes']);
  v.innerHTML=`<div class="ph"><div><h1>Clientes no Instagram</h1><p>Perfis de clientes que você gerencia.</p></div></div>
  <section class="card"><div class="empty">Nenhum cliente conectado ainda.<br><span class="note">Cada cliente vai autorizar o Privo Post pela conta dele. Entra numa próxima etapa.</span></div></section>`}

/* ---------- Google: perfil ---------- */
function vGoogle(v,id){const p=gPerfis().find(x=>x.id===id);
  if(!p){crumb(['Google Meu Negócio']);v.innerHTML=Array.isArray(S.gContas)?'<section class="card"><div class="empty">Perfil não encontrado.</div></section>':'<p class="muted"><span class="spin"></span> Carregando…</p>';return}
  crumb([['Google Meu Negócio','#/conexoes'],p.cliente?'Clientes':'Meu perfil',p.nome]);
  v.innerHTML=`<div class="ph"><div><h1>${esc(p.nome)}</h1><p>${esc(p.endereco||'Sem endereço público')} · conta ${esc(p.conta)}</p></div>
    <span class="pill ${p.cliente?'warn':'acc'}">${p.cliente?'Cliente — não usar':'Seu perfil'}</span></div>
  <section class="card"><div class="ch"><h2>O que dá para fazer aqui</h2></div><div class="cb">
    <p style="margin:0">Por enquanto o Privo Post só lê a lista de perfis do Google. Publicar posts e responder avaliações entram numa próxima fase, quando o Google liberar a API de posts para o projeto.</p>
    ${p.cliente?'<p class="note">Perfil de cliente: o Privo Post não faz nada nele até você liberar.</p>':''}</div></section>`}

/* ---------- volta das conexões ---------- */
const VOLTA={google:{conectado:['ok','Google conectado.'],cancelado:['warn','Conexão com o Google cancelada. Nada foi guardado.'],expirado:['bad','O pedido de conexão venceu ou já foi usado. Conecte de novo.'],'sem-permissao':['bad','O Google não deu a permissão de gerenciar os perfis. Conecte de novo e marque a permissão.'],erro:['bad','Não deu para conectar o Google. Tente de novo.']},
  instagram:{conectado:['ok','Instagram conectado.'],cancelado:['warn','Conexão com o Instagram cancelada. Nada foi guardado.'],expirado:['bad','O pedido de conexão venceu ou já foi usado. Conecte de novo.'],'sem-permissao':['bad','O Instagram não deu a permissão de publicar. Conecte de novo e deixe as permissões marcadas.'],erro:['bad','Não deu para conectar o Instagram. Tente de novo.']}};
(()=>{const q=new URLSearchParams(location.search);for(const k of ['google','instagram']){const x=q.get(k);if(x){const t=VOLTA[k][x]||VOLTA[k].erro;flash=aviso(t[0],t[1]);
  history.replaceState(null,'',location.pathname+(k==='instagram'&&x==='conectado'?'#/instagram/eu/perfil':'#/conexoes'))}}})();

/* ---------- login ---------- */
async function boot(){const {data:{session}}=await sb.auth.getSession();
  if(!session){$('shell').hidden=true;$('login').hidden=false;setTimeout(()=>$('lg-email').focus(),50);return}
  S.user=session.user;$('login').hidden=true;$('shell').hidden=false;$('shell').classList.toggle('mini',store.get('pp-mini')==='1');
  renderSide();$('view').innerHTML='<p class="muted"><span class="spin"></span> Carregando…</p>';
  await carregarStatus();render()}
$('lg-form').addEventListener('submit',async e=>{e.preventDefault();const b=$('lg-btn'),m=$('lg-msg');b.disabled=true;m.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('lg-email').value.trim(),password:$('lg-pass').value});
  b.disabled=false;if(error){m.textContent='E-mail ou senha incorretos.';return}boot()});
boot();
</script>
