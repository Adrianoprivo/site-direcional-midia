<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Privo Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Privo Post — mini sistema: menu lateral (expande/recolhe), áreas por canal, abas por perfil. Ver post/docs/spec.md */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --side:#FBFBFC; --sunk:#EEF1F4; --hover:#F1F3F6; --line:#E3E7EC; --line2:#D5DBE2;
  --ink:#141A22; --ink2:#3B4654; --muted:#6B7684;
  --accent:#0B6477; --accent-ink:#FFFFFF; --accent-soft:#E2F0F2;
  --bad:#C2303F; --bad-soft:#FBE7EA; --ok:#0E8A5C; --ok-soft:#E1F4EB; --warn:#8A5A00; --warn-soft:#FBF0DA;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --wside:248px; --shadow:0 12px 32px rgb(15 25 40 / .14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#151A21; --side:#12161C; --sunk:#1C222B; --hover:#1A2028; --line:#242C36; --line2:#2E3743;
  --ink:#E6EAEF; --ink2:#C3CBD5; --muted:#8C97A5; --accent:#4CB8CB; --accent-ink:#06181C; --accent-soft:#13313A;
  --bad:#F0606F; --bad-soft:#3A1D23; --ok:#2DBB85; --ok-soft:#12302A; --warn:#E9B44C; --warn-soft:#382D14; --shadow:0 12px 34px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#151A21; --side:#12161C; --sunk:#1C222B; --hover:#1A2028; --line:#242C36; --line2:#2E3743;
  --ink:#E6EAEF; --ink2:#C3CBD5; --muted:#8C97A5; --accent:#4CB8CB; --accent-ink:#06181C; --accent-soft:#13313A;
  --bad:#F0606F; --bad-soft:#3A1D23; --ok:#2DBB85; --ok-soft:#12302A; --warn:#E9B44C; --warn-soft:#382D14; --shadow:0 12px 34px rgb(0 0 0 / .5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- casca ---------- */
.shell{display:grid;grid-template-columns:var(--wside) minmax(0,1fr);min-height:100vh}
.shell.mini{--wside:60px}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;min-height:44px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;font-size:14px;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 8px 4px}
.ni{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;padding:7px 8px;text-align:left;color:var(--ink2);text-decoration:none;font-weight:500;min-height:34px}
.ni:hover{background:var(--hover);color:var(--ink)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.ni .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .chev{width:14px;height:14px;transition:transform .15s;opacity:.7}
.ni[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ni .dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.ni .dot.on{background:var(--ok)}
.sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 4px 17px;padding-left:11px;border-left:1px solid var(--line)}
.sub .ni{font-size:13px;min-height:30px;padding:5px 8px}
.sub .grp{font-size:11px;color:var(--muted);padding:8px 8px 2px;font-weight:600}
.sub .tag{font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--warn-soft);color:var(--warn);flex:none}
.sidefoot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.who{font-size:12px;color:var(--muted);padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:60}
.shell.mini .side{padding-left:10px;padding-right:10px}
.shell.mini .brand div,.shell.mini .ni .lbl,.shell.mini .ni .chev,.shell.mini .nav .sec,.shell.mini .sub,.shell.mini .who,.shell.mini .ni .dot{display:none}
.shell.mini .ni{justify-content:center;padding:8px}
.shell.mini .ni:hover .tip{opacity:1}
.shell.mini .brand{justify-content:center;padding:4px 0 14px}
.shell.mini .side{overflow:visible}
.shell.mini .toggle svg{transform:rotate(180deg)}

/* ---------- área principal ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 24px 10px;min-height:52px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;flex:1}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span,.crumb a{white-space:nowrap}
.crumb a{color:var(--muted);text-decoration:none;border-radius:6px;padding:2px 4px;margin:0 -4px}
.crumb a:hover{color:var(--ink);background:var(--hover)}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;place-items:center}
.content{padding:24px;max-width:1180px;width:100%}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:9px 12px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card+.card{margin-top:16px}
.grid>.card+.card{margin-top:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:14px;font-weight:600}
.ch p{margin:0;color:var(--muted);font-size:12px}
.cb{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default}
.muted{color:var(--muted)}
.msg{border-radius:8px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.prof{display:flex;gap:16px;align-items:flex-start}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--sunk);flex:none;border:1px solid var(--line)}
.prof h3{margin:0;font-size:16px}
.bio{white-space:pre-line;margin:8px 0 0;color:var(--ink2)}
.stats{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap}
.stats b{display:block;font-size:16px}
.stats span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--side)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
.thumb{width:40px;height:50px;border-radius:6px;object-fit:cover;background:var(--sunk);display:block}
.cap{max-width:280px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.list .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row b{display:block;font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.filtros{display:flex;gap:10px;flex-wrap:wrap}
.filtros label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.filtros select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
th.ord button{all:unset;cursor:pointer;font:inherit;color:inherit;font-weight:600}
th.ord button:hover{color:var(--ink)}
th.ord button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.periodo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.periodo select,.periodo input[type=date]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
.periodo .muted{font-size:12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);cursor:pointer}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi2{background:var(--surface);padding:12px 14px}
.kpi2 .l{font-size:12px;color:var(--muted)}
.kpi2 .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi2 .s{font-size:12px;margin-top:2px}
.dl{font-weight:600;font-size:12px;white-space:nowrap}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
.tagx{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.prof .stats{margin-top:0;flex:none}
.cf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:center}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.login label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.login input{font:inherit;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 11px}
.login input:focus{outline:2px solid var(--accent);outline-offset:1px}
.login .err{color:var(--bad);min-height:1.2em;margin:0;font-size:13px}
.login .btn{justify-content:center;padding:10px}

/* ---------- celular ---------- */
.scrim{display:none}
@media (max-width:860px){
  .shell,.shell.mini{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:272px;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .shell.open .side{transform:none}
  .shell.mini .brand div,.shell.mini .ni .lbl,.shell.mini .ni .chev,.shell.mini .nav .sec,.shell.mini .sub,.shell.mini .who,.shell.mini .ni .dot{display:revert}
  .shell.mini .ni{justify-content:flex-start;padding:7px 8px}
  .toggle{display:none!important}
  .scrim{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .shell.open .scrim{opacity:1;pointer-events:auto}
  .burger{display:grid}
  .top{padding-left:16px;padding-right:16px}
  .content{padding:16px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1fr)}
  .prof{flex-direction:column}
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cap{max-width:120px}
  th,td{padding:9px 8px}
  .crumb span,.crumb a{display:none}
  .ch{flex-wrap:wrap}
}
</style></head>
<body>
<div class="login" id="login" hidden><form id="lg-form">
  <div class="brand" style="padding:0"><span class="logo">PP</span><div><b>Privo Post</b><small>Direcional Mídia</small></div></div>
  <label>E-mail<input id="lg-email" type="email" autocomplete="username" required></label>
  <label>Senha<input id="lg-pass" type="password" autocomplete="current-password" required></label>
  <p class="err" id="lg-msg" role="alert"></p><button class="btn pri" id="lg-btn" type="submit">Entrar</button></form></div>

<div class="shell" id="shell" hidden>
  <aside class="side" id="side" aria-label="Menu principal"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top"><button class="burger" id="burger" type="button" aria-label="Abrir menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="crumb" id="crumb" aria-label="Você está em"></nav><div id="topact"></div></header>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://ftahvdzbyqnvarukytws.supabase.co',SB_KEY='sb_publishable_TRsKX1yVSB8EYPxbaSOFAg_HM8AVpI7';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>n==null?'—':Number(n).toLocaleString('pt-BR');
const dataBR=d=>{if(!d)return '';const x=new Date(d+(String(d).length===10?'T12:00:00':''));return isNaN(x)?'':x.toLocaleDateString('pt-BR')};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- ícones ---------- */
const P={
  home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
  ig:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/>',
  gmn:'<path d="M3 9.5 4.5 5h15L21 9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/>',
  plug:'<path d="M9 7V3M15 7V3"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m15 10-2 2 2 2"/>',
  out:'<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/>',ext:'<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 14v6H4V5h6"/>'};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* ---------- dados ---------- */
const S={user:null,ig:null,igPerfil:null,igPosts:null,igConta:null,g:null,gContas:null,aberto:JSON.parse(store.get('pp-aberto')||'{"ig":true,"gmn":true}')};
async function api(fn,corpo){const r=await sb.functions.invoke(fn,{body:corpo||{}});
  if(r.error){let m='Não deu para falar com o servidor. Tente de novo.';try{const j=await r.error.context.json();if(j&&j.erro)m=j.erro}catch(e){}throw new Error(m)}
  return r.data}
async function carregarStatus(){
  const [i,g]=await Promise.allSettled([api('ig-api',{acao:'status'}),api('gbp-api',{acao:'status'})]);
  S.ig=i.status==='fulfilled'?i.value:{conectado:false,erro:i.reason.message};
  S.g=g.status==='fulfilled'?g.value:{conectado:false,erro:g.reason.message};
  if(S.g.conectado&&!S.gContas){try{S.gContas=(await api('gbp-api',{acao:'perfis'})).contas}catch(e){S.gContas={erro:e.message}}}
}
const gPerfis=()=>Array.isArray(S.gContas)?S.gContas.flatMap(a=>a.perfis.map(p=>({...p,conta:a.nome}))):[];
const slug=id=>encodeURIComponent(id);

/* ---------- menu lateral ---------- */
function renderSide(){const r=rota();const cur=h=>location.hash===h||(h!=='#/'&&location.hash.startsWith(h+'/'))?' aria-current="page"':'';
  const meus=gPerfis().filter(p=>!p.cliente),cli=gPerfis().filter(p=>p.cliente);
  const igU=S.ig&&S.ig.conectado?'@'+(S.ig.usuario||'meu perfil'):null;
  $('side').innerHTML=`<div class="brand"><span class="logo">PP</span><div><b>Privo Post</b><small>Direcional Mídia</small></div></div>
  <nav class="nav">
    <a class="ni" href="#/"${location.hash===''||location.hash==='#/'?' aria-current="page"':''}>${ic('home')}<span class="lbl">Painel</span><span class="tip">Painel</span></a>
    <div class="sec">Canais</div>
    <button class="ni" type="button" data-tg="ig" aria-expanded="${!!S.aberto.ig}">${ic('ig')}<span class="lbl">Instagram</span><span class="dot${S.ig&&S.ig.conectado?' on':''}"></span>${ic('chev','i chev')}<span class="tip">Instagram</span></button>
    ${S.aberto.ig?`<div class="sub"><div class="grp">Meu perfil</div>
      ${igU?`<a class="ni" href="#/instagram/eu/perfil"${cur('#/instagram/eu')}><span class="lbl">${esc(igU)}</span></a>`:`<a class="ni" href="#/conexoes"><span class="lbl muted">Conectar…</span></a>`}
      <div class="grp">Clientes</div><a class="ni" href="#/instagram/clientes"${cur('#/instagram/clientes')}><span class="lbl">Nenhum ainda</span></a></div>`:''}

/* ---- período (IG-PER-01): mesmas opções do Gerenciador de Anúncios; "últimos N dias" sem contar hoje ---- */
const PRESETS=[['hoje','Hoje'],['ontem','Ontem'],['7','Últimos 7 dias'],['14','Últimos 14 dias'],['30','Últimos 30 dias'],['semana','Esta semana'],['semana_passada','Semana passada'],['mes','Este mês'],['mes_passado','Mês passado'],['max','Máximo'],['custom','Personalizado']];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dia0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const soma=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function intervalo(p,limiteDias){const h=dia0(new Date());let de,ate;
  const seg=soma(h,-((h.getDay()+6)%7)); // semana começa na segunda
  switch(p.preset){
    case 'hoje':de=ate=h;break; case 'ontem':de=ate=soma(h,-1);break;
    case '7':case '14':case '30':de=soma(h,-Number(p.preset));ate=soma(h,-1);break;
    case 'semana':de=seg;ate=h;break; case 'semana_passada':de=soma(seg,-7);ate=soma(seg,-1);break;
    case 'mes':de=new Date(h.getFullYear(),h.getMonth(),1);ate=h;break;
    case 'mes_passado':de=new Date(h.getFullYear(),h.getMonth()-1,1);ate=new Date(h.getFullYear(),h.getMonth(),0);break;
    case 'max':de=limiteDias?soma(h,-limiteDias):new Date(2000,0,1);ate=h;break;
    case 'custom':de=p.de?new Date(p.de+'T00:00:00'):soma(h,-7);ate=p.ate?new Date(p.ate+'T00:00:00'):soma(h,-1);break;
  }
  if(limiteDias&&de<soma(h,-limiteDias))de=soma(h,-limiteDias);
  if(ate<de)ate=de;
  const n=Math.round((ate-de)/864e5)+1;
  return {de,ate,n,ant:{de:soma(de,-n),ate:soma(de,-1)}};
}
const fmtI=i=>i.n===1?dataBR(iso(i.de)):`${dataBR(iso(i.de))} a ${dataBR(iso(i.ate))}`;
function seletorPeriodo(id,p,limiteDias){const i=intervalo(p,limiteDias);
  return `<div class="periodo" id="${id}"><select data-p="preset" aria-label="Período">${PRESETS.map(([k,l])=>`<option value="${k}"${p.preset===k?' selected':''}>${l}</option>`).join('')}</select>
    ${p.preset==='custom'?`<input type="date" data-p="de" value="${iso(i.de)}" aria-label="De"><input type="date" data-p="ate" value="${iso(i.ate)}" aria-label="Até">`:`<span class="muted">${esc(fmtI(i))}</span>`}
    <label class="chk"><input type="checkbox" data-p="comparar"${p.comparar?' checked':''}> Comparar com período anterior</label></div>`}
function ligarPeriodo(id,p,salvar,depois){const el=$(id);if(!el)return;el.querySelectorAll('[data-p]').forEach(x=>x.onchange=()=>{const k=x.dataset.p;

async function abaVisao(el){const f=S.igPerfil;const i=intervalo(PC,90);const chave=iso(i.de)+'|'+iso(i.ate)+'|'+!!PC.comparar;

  ligarPeriodo('pc',PC,salvarPC,()=>abaVisao(el));
  const pegarPer=async()=>{if(!S.igPer[chave])S.igPer[chave]=await api('ig-api',{acao:'periodo',de:iso(i.de),ate:iso(i.ate),comparar:!!PC.comparar});return S.igPer[chave]};

function tabelaTend(periodos){const [d7,d14,d30]=periodos;
  const linhas=MC.map(([k,l])=>{const a=d7.m[k],c=d30.m[k];const pouco=c!=null&&c<10;const t=!pouco&&a!=null&&c?((a/7)/(c/30)-1)*100:null;return {k,l,v7:a,v14:d14.m[k],v30:c,t,pouco}});
  const val=(x)=>({nome:x.l,v7:x.v7??-1,v14:x.v14??-1,v30:x.v30??-1,tend:x.t??-1e9})[OT.ord];
  linhas.sort((x,y)=>{const a=val(x),b=val(y);return (typeof a==='string'?a.localeCompare(b):a-b)*OT.dir});
  const H=[['nome','Métrica',''],['v7','Últimos 7 dias','n'],['v14','Últimos 14 dias','n'],['v30','Últimos 30 dias','n'],['tend','Tendência','n']];
  $('tend').innerHTML=`<div class="tw"><table><thead><tr>${H.map(([k,l,c])=>`<th class="${c} ord"><button type="button" data-ot="${k}">${l}${OT.ord===k?(OT.dir<0?' ↓':' ↑'):''}</button></th>`).join('')}</tr></thead>
    <tbody>${linhas.map(x=>`<tr><td>${x.l}</td><td class="n num">${num(x.v7)}</td><td class="n num">${num(x.v14)}</td><td class="n num">${num(x.v30)}</td>
    <td class="n">${x.pouco?'<span class="muted" title="Menos de 10 nos últimos 30 dias: pouco volume para ler tendência.">pouco volume</span>':x.t==null?'<span class="muted">—</span>':`<span class="dl ${x.t>0?'up':x.t<0?'down':''}">${x.t>0?'▲':x.t<0?'▼':''} ${Math.abs(x.t).toLocaleString('pt-BR',{maximumFractionDigits:0})}%</span>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="note cb" style="margin:0">▲ = nos últimos 7 dias a métrica rendeu mais por dia do que a média dos últimos 30. “Pouco volume” = menos de 10 nos últimos 30 dias, cedo para ler tendência. Para contas alcançadas e engajadas a tendência é aproximada (contas únicas não se somam dia a dia).</p>`;
  $('tend').querySelectorAll('[data-ot]').forEach(b=>b.onclick=()=>{const k=b.dataset.ot;if(OT.ord===k)OT.dir*=-1;else{OT.ord=k;OT.dir=k==='nome'?1:-1}store.set('pp-otend',JSON.stringify(OT));tabelaTend(periodos)});
}

/* ---- Métricas por post (IG-MET-01..03, 05, 08) ---- */
/* Engajamento ponderado = (compart.×4 + coment.×3 + salvos×2 + curtidas×1) ÷ alcance.
   Alcance menor que as curtidas é impossível: o Instagram não informa alcance confiável para posts antigos (até jun/2024). */
const confiavel=m=>m&&m.reach!=null&&m.reach>0&&m.reach>=(m.likes||0);
const pontos=m=>(m.shares||0)*4+(m.comments||0)*3+(m.saved||0)*2+(m.likes||0);
const engaj=m=>confiavel(m)?pontos(m)/m.reach*100:null;
const COLS=[['data','Data'],['views','Visualiz.'],['reach','Alcance'],['likes','Curtidas'],['comments','Coment.'],['shares','Compart.'],['saved','Salvos'],['eng','Engaj. pond.']];
const F=JSON.parse(store.get('pp-fpost')||'{"ord":"data","dir":-1,"tipo":""}');
function salvarF(){store.set('pp-fpost',JSON.stringify(F))}
function valor(x,k){if(k==='data')return new Date(x.data).getTime();if(k==='eng')return engaj(x.metricas)??-1;return (x.metricas||{})[k]??-1}
async function carregarAte(limite){ // carrega posts até cobrir a data pedida (null = todos)
  if(!S.igPosts){const r=await api('ig-api',{acao:'posts'});S.igPosts={lista:r.posts,proximo:r.proximo}}
  let n=0;while(S.igPosts.proximo&&n<40){const ult=S.igPosts.lista.at(-1);if(limite&&ult&&new Date(ult.data)<limite)break;
    const r=await api('ig-api',{acao:'posts',depois:S.igPosts.proximo});S.igPosts.lista.push(...r.posts);S.igPosts.proximo=r.proximo;n++}}
function resumo(lista){const conf=lista.filter(x=>confiavel(x.metricas));
  const alc=conf.reduce((s,x)=>s+x.metricas.reach,0),pts=conf.reduce((s,x)=>s+pontos(x.metricas),0);
  const melhor=conf.slice().sort((a,b)=>engaj(b.metricas)-engaj(a.metricas))[0];
  return {posts:lista.length,views:lista.reduce((s,x)=>s+(x.metricas.views||0),0),alcance:alc,eng:alc?pts/alc*100:null,melhor,semAlcance:lista.length-conf.length}}
const pct=v=>v==null?'—':v.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
async function abaPosts(el){const i=intervalo(PP,null);
  el.innerHTML=`<p class="muted"><span class="spin"></span> Carregando os posts do período…</p>`;
  await carregarAte(PP.preset==='max'?null:(PP.comparar?i.ant.de:i.de));
  const dentro=(x,a,b)=>{const d=dia0(new Date(x.data));return d>=a&&d<=b};
  const todos=S.igPosts.lista;
  const doTipo=todos.filter(x=>!F.tipo||x.tipo===F.tipo);
  const lista=doTipo.filter(x=>PP.preset==='max'||dentro(x,i.de,i.ate)).sort((a,b)=>(valor(a,F.ord)-valor(b,F.ord))*F.dir);
  const ant=PP.comparar&&PP.preset!=='max'?doTipo.filter(x=>dentro(x,i.ant.de,i.ant.ate)):null;
  const R=resumo(lista),RA=ant?resumo(ant):null;
  const tipos=[...new Set(todos.map(x=>x.tipo))];
  el.innerHTML=`<section class="card"><div class="ch"><div><h2>Posts publicados no período</h2><p>${PP.preset==='max'?'Todos os posts que o Instagram entrega pela API.':'Posts publicados entre essas datas.'} Clique no título da coluna para ordenar.</p></div>
    <div class="filtros">${seletorPeriodo('pp',PP,null)}<label>Tipo <select id="f-tipo"><option value="">Todos</option>${tipos.map(t=>`<option value="${esc(t)}"${F.tipo===t?' selected':''}>${esc(TIPO[t]||t)}</option>`).join('')}</select></label></div></div>
    <div class="cb"><div class="kgrid">
      <div class="kpi2"><div class="l">Posts</div><div class="v num">${num(R.posts)}</div><div class="s">${RA?`${delta(R.posts,RA.posts)} <span class="muted">vs ${num(RA.posts)}</span>`:'&nbsp;'}</div></div>
      <div class="kpi2"><div class="l">Visualizações somadas</div><div class="v num">${num(R.views)}</div><div class="s">${RA?`${delta(R.views,RA.views)} <span class="muted">vs ${num(RA.views)}</span>`:'&nbsp;'}</div></div>
      <div class="kpi2"><div class="l">Alcance somado</div><div class="v num">${num(R.alcance)}</div><div class="s">${RA?`${delta(R.alcance,RA.alcance)} <span class="muted">vs ${num(RA.alcance)}</span>`:'&nbsp;'}</div></div>
      <div class="kpi2"><div class="l">Engajamento ponderado</div><div class="v num">${pct(R.eng)}</div><div class="s">${RA?`${R.eng!=null&&RA.eng!=null?`<span class="dl ${R.eng>RA.eng?'up':R.eng<RA.eng?'down':''}">${R.eng>RA.eng?'▲':R.eng<RA.eng?'▼':''} ${Math.abs(R.eng-RA.eng).toLocaleString('pt-BR',{maximumFractionDigits:1})} p.p.</span>`:''} <span class="muted">vs ${pct(RA.eng)}</span>`:'&nbsp;'}</div></div>
    </div>${R.melhor?`<p class="note">Melhor post do período: <a href="${esc(R.melhor.link)}" target="_blank" rel="noopener">${esc((R.melhor.legenda||'(sem legenda)').slice(0,70))}</a> · ${pct(engaj(R.melhor.metricas))}</p>`:''}
    ${RA?'<p class="note">Atenção na comparação: os números de cada post somam desde a publicação. Posts mais novos ainda tiveram menos tempo para juntar resultado.</p>':''}</div>
  ${lista.length?`<div class="tw"><table><thead><tr><th></th><th>Post</th><th>Tipo</th>${COLS.map(([k,l])=>`<th class="${k==='data'?'':'n'} ord"><button type="button" data-ord="${k}">${l}${F.ord===k?(F.dir<0?' ↓':' ↑'):''}</button></th>`).join('')}</tr></thead>
  <tbody>${lista.map(x=>{const m=x.metricas||{},e=engaj(m);return `<tr><td>${x.capa?`<img class="thumb" src="${esc(x.capa)}" alt="" loading="lazy">`:'<span class="thumb"></span>'}</td>
    <td><div class="cap"><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.legenda||'(sem legenda)')}</a></div></td>
    <td>${esc(TIPO[x.tipo]||x.tipo||'')}</td><td>${esc(new Date(x.data).toLocaleDateString('pt-BR'))}</td>
    <td class="n num">${num(m.views)}</td><td class="n num">${confiavel(m)?num(m.reach):`<span class="muted" title="O Instagram informou alcance ${num(m.reach)}, menor que as curtidas.">${num(m.reach)}*</span>`}</td><td class="n num">${num(m.likes)}</td><td class="n num">${num(m.comments)}</td><td class="n num">${num(m.shares)}</td><td class="n num">${num(m.saved)}</td>
    <td class="n num">${e==null?'<span class="tagx" title="Alcance informado pelo Instagram é menor que as curtidas.">não confiável</span>':`<b>${pct(e)}</b>`}</td></tr>`}).join('')}</tbody></table></div>`
    :'<div class="empty">Nenhum post publicado nesse período.</div>'}
  <div class="cf">${PP.preset==='max'&&S.igPosts.proximo?'<button class="btn" id="mais" type="button">Carregar mais 12 posts</button>':`<span class="muted">${num(todos.length)} posts carregados${S.igPosts.proximo?'':' (todos que a API entrega)'}.</span>`}</div></section>
  <p class="note"><b>Engajamento ponderado</b> = (compartilhamentos × 4 + comentários × 3 + salvos × 2 + curtidas × 1) ÷ alcance. Compartilhar pesa mais porque é o que leva o post a gente nova; curtida é o engajamento mais leve. No período, é a soma dos pontos ÷ a soma do alcance.
  ${R.semAlcance?`<br>* ${num(R.semAlcance)} post(s) com alcance não confiável ficam fora do engajamento: o Instagram não informa alcance correto para posts antigos (até junho de 2024).`:''}</p>`;
  el.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{const k=b.dataset.ord;if(F.ord===k)F.dir*=-1;else{F.ord=k;F.dir=-1}salvarF();abaPosts(el)});
  $('f-tipo').onchange=e=>{F.tipo=e.target.value;salvarF();abaPosts(el)};
  ligarPeriodo('pp',PP,salvarPP,()=>abaPosts(el));
  const m=$('mais');if(m)m.onclick=async()=>{m.disabled=true;m.innerHTML='<span class="spin"></span> Carregando…';
    try{const r=await api('ig-api',{acao:'posts',depois:S.igPosts.proximo});S.igPosts.lista.push(...r.posts);S.igPosts.proximo=r.proximo;abaPosts(el)}
    catch(e){m.disabled=false;m.textContent='Carregar mais 12 posts';el.insertAdjacentHTML('afterbegin',aviso('bad',e.message))}};
}

/* ---------- Instagram: clientes ---------- */
function vIgClientes(v){crumb([['Instagram','#/instagram/eu/perfil'],'Clientes']);
  v.innerHTML=`<div class="ph"><div><h1>Clientes no Instagram</h1><p>Perfis de clientes que você gerencia.</p></div></div>
  <section class="card"><div class="empty">Nenhum cliente conectado ainda.<br><span class="note">Cada cliente vai autorizar o Privo Post pela conta dele. Entra numa próxima etapa.</span></div></section>`}

/* ---------- Google: perfil ---------- */
function vGoogle(v,id){const p=gPerfis().find(x=>x.id===id);
  if(!p){crumb(['Google Meu Negócio']);v.innerHTML=Array.isArray(S.gContas)?'<section class="card"><div class="empty">Perfil não encontrado.</div></section>':'<p class="muted"><span class="spin"></span> Carregando…</p>';return}
  crumb([['Google Meu Negócio','#/conexoes'],p.cliente?'Clientes':'Meu perfil',p.nome]);
  v.innerHTML=`<div class="ph"><div><h1>${esc(p.nome)}</h1><p>${esc(p.endereco||'Sem endereço público')} · conta ${esc(p.conta)}</p></div>
    <span class="pill ${p.cliente?'warn':'acc'}">${p.cliente?'Cliente — não usar':'Seu perfil'}</span></div>
  <section class="card"><div class="ch"><h2>O que dá para fazer aqui</h2></div><div class="cb">
    <p style="margin:0">Por enquanto o Privo Post só lê a lista de perfis do Google. Publicar posts e responder avaliações entram numa próxima fase, quando o Google liberar a API de posts para o projeto.</p>
    ${p.cliente?'<p class="note">Perfil de cliente: o Privo Post não faz nada nele até você liberar.</p>':''}</div></section>`}

/* ---------- volta das conexões ---------- */
const VOLTA={google:{conectado:['ok','Google conectado.'],cancelado:['warn','Conexão com o Google cancelada. Nada foi guardado.'],expirado:['bad','O pedido de conexão venceu ou já foi usado. Conecte de novo.'],'sem-permissao':['bad','O Google não deu a permissão de gerenciar os perfis. Conecte de novo e marque a permissão.'],erro:['bad','Não deu para conectar o Google. Tente de novo.']},
  instagram:{conectado:['ok','Instagram conectado.'],cancelado:['warn','Conexão com o Instagram cancelada. Nada foi guardado.'],expirado:['bad','O pedido de conexão venceu ou já foi usado. Conecte de novo.'],'sem-permissao':['bad','O Instagram não deu a permissão de publicar. Conecte de novo e deixe as permissões marcadas.'],erro:['bad','Não deu para conectar o Instagram. Tente de novo.']}};
(()=>{const q=new URLSearchParams(location.search);for(const k of ['google','instagram']){const x=q.get(k);if(x){const t=VOLTA[k][x]||VOLTA[k].erro;flash=aviso(t[0],t[1]);
  history.replaceState(null,'',location.pathname+(k==='instagram'&&x==='conectado'?'#/instagram/eu/perfil':'#/conexoes'))}}})();

/* ---------- login ---------- */
async function boot(){const {data:{session}}=await sb.auth.getSession();
  if(!session){$('shell').hidden=true;$('login').hidden=false;setTimeout(()=>$('lg-email').focus(),50);return}
  S.user=session.user;$('login').hidden=true;$('shell').hidden=false;$('shell').classList.toggle('mini',store.get('pp-mini')==='1');
  renderSide();$('view').innerHTML='<p class="muted"><span class="spin"></span> Carregando…</p>';
  await carregarStatus();render()}
$('lg-form').addEventListener('submit',async e=>{e.preventDefault();const b=$('lg-btn'),m=$('lg-msg');b.disabled=true;m.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('lg-email').value.trim(),password:$('lg-pass').value});
  b.disabled=false;if(error){m.textContent='E-mail ou senha incorretos.';return}boot()});
boot();
</script>
