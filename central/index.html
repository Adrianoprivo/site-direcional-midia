<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Central de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: quadro estilo planilha; cada projeto é um grupo colorido com itens e subelementos; barra de ferramentas fixa acima; 1ª coluna presa ao rolar para o lado */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --row:#FFFFFF; --rowh:#F1F5F9; --sunk:#E8EDF2; --line:#D8DFE6; --ink:#18202C; --muted:#5D6A79;
  --accent:#0B6477; --accent-ink:#FFFFFF; --accent-soft:#D6ECEF; --late:#D93B4C; --done:#0E9F6A; --pop:#FFFFFF; --shadow:0 10px 30px rgb(15 25 40 / .16);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --wname:380px; --wcol:150px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#171C25; --row:#1A2029; --rowh:#212833; --sunk:#252C37; --line:#2C3541; --ink:#E4E9EF; --muted:#94A0AE;
  --accent:#3FB2C6; --accent-ink:#06181C; --accent-soft:#14343B; --late:#F0606F; --done:#27B37F; --pop:#202733; --shadow:0 12px 34px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#171C25; --row:#1A2029; --rowh:#212833; --sunk:#252C37; --line:#2C3541; --ink:#E4E9EF; --muted:#94A0AE;
  --accent:#3FB2C6; --accent-ink:#06181C; --accent-soft:#14343B; --late:#F0606F; --done:#27B37F; --pop:#202733; --shadow:0 12px 34px rgb(0 0 0 / .45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding:0}
/* casca: menu lateral + área principal */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.shell.side-hidden{grid-template-columns:64px minmax(0,1fr)}
.shell.side-hidden .side{overflow:visible;padding:0;z-index:30}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 20px;padding-left:env(safe-area-inset-left,0px)}
.rail .ri{position:relative;width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.rail .ri:hover{background:var(--sunk);color:var(--ink)}
.rail .ri[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.rail .ri svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .gq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:13px}
.rail .ri[aria-current="true"] .gq{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--g)}
.rail hr{width:28px;border:0;border-top:1px solid var(--line);margin:6px 0}
.rail .tipr{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:60}
.rail .ri:hover .tipr,.rail .ri:focus-visible .tipr{opacity:1}
.rail .groups{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.sbrand{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.sbrand .hide{border:0;background:transparent;color:var(--muted);border-radius:6px;width:28px;height:28px;font-size:16px}
.sbrand .hide:hover{background:var(--sunk);color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:2px}
.sec-h{display:flex;align-items:center;gap:2px;padding:0 2px 0 4px;border-radius:8px}
.sec-h:hover{background:var(--sunk)}
.sec-h .tg{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left}
.sec-h .tg svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;fill:none;transition:transform .15s;flex:none}
.sec.closed .sec-h .tg svg{transform:rotate(-90deg)}
.sec-h .tg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h .tg b{font-family:var(--f-num);font-weight:500;letter-spacing:0}
.sec-h .ic{border:0;background:transparent;color:var(--muted);border-radius:6px;width:26px;height:26px;font-size:16px;line-height:1;opacity:.75}
.sec-h .ic:hover{background:var(--surface);color:var(--ink);opacity:1}
.sec-h input{flex:1;min-width:0;border:1px solid var(--accent);background:var(--surface);border-radius:6px;padding:4px 8px;font-weight:600;font-size:13px}
.sec.closed .snav{display:none}
.addsec{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px 10px;color:var(--muted);font-weight:600;text-align:left}
.addsec:hover{border-color:var(--accent);color:var(--accent)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 18px) 12px 24px max(12px,env(safe-area-inset-left,0px))}
.side .brand{padding:0 8px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left;font-weight:500;color:var(--ink)}
.snav button:hover{background:var(--sunk)}
.snav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.snav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.snav .ct{margin-left:auto;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.shead{display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.shead button{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;border-radius:6px;width:26px;height:26px}
.shead button:hover{background:var(--sunk);color:var(--ink)}
.snav .dot{width:10px;height:10px;border-radius:3px;flex:none}
.snav .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.main{min-width:0;display:flex;flex-direction:column;gap:14px;padding-block:calc(env(safe-area-inset-top,0px) + 18px) 60px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mhead{display:flex;align-items:center;gap:10px}
.mhead h2{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
.menubtn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;place-items:center}
.menubtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.scrim-m{display:none}
.views:empty,.tools:empty{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,85vw);z-index:40;transform:translateX(-102%);transition:transform .2s;height:auto}
  .shell.menu-open .side{transform:none;box-shadow:var(--shadow)}
  .shell.menu-open .scrim-m{display:block;position:fixed;inset:0;background:rgb(8 14 20 / .4);z-index:39}
  .menubtn{display:grid}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
/* formulários */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
button.fcard:hover{border-color:var(--accent)}
.fcard h3{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700}
.fcard p{margin:0;color:var(--muted);font-size:13px}
.fcard .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:auto}
.fcard .meta b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.tpl{border-style:dashed}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 -2px}
.sect-h h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.ftop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.back{border:0;background:transparent;color:var(--muted);font-weight:600;padding:4px 0}
.back:hover{color:var(--ink)}
.feditor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fbox label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.fbox input[type=text],.fbox textarea,.fbox select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;font-weight:400;color:var(--ink)}
.fbox textarea{resize:vertical;min-height:54px}
.ftitle{font-family:var(--f-display);font-size:22px;font-weight:700;border:0!important;background:transparent!important;padding:0!important}
.qcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;gap:8px;align-items:center}
.qrow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.qrow select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 8px}
.qn{font-family:var(--f-num);font-size:12px;color:var(--muted);width:22px;flex:none}
.qtools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.qtools .ib{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px}
.qtools .ib:hover{background:var(--sunk);color:var(--ink)}
.qtools label{display:inline-flex;gap:6px;align-items:center;margin-right:auto;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:6px;padding-left:30px}
.opts .qrow input{padding:5px 9px}
.addq{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chipb:hover{border-color:var(--accent);color:var(--accent)}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn2.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn2.danger{color:var(--late);border-color:var(--late);background:transparent}
/* formulário preenchível */
.fill{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.fill .band{height:6px;background:var(--accent)}
.fill .inner{padding:24px;display:flex;flex-direction:column;gap:20px}
.fill h3{font-family:var(--f-display);font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
.fill .desc{margin:-12px 0 0;color:var(--muted)}
.fq{display:flex;flex-direction:column;gap:8px}
.fq .ql{font-weight:600;font-size:15px}
.fq .ql i{color:var(--late);font-style:normal}
.fq input[type=text],.fq input[type=email],.fq input[type=tel],.fq input[type=number],.fq input[type=date],.fq textarea,.fq select{border:0;border-bottom:2px solid var(--line);background:transparent;padding:8px 2px;font-size:16px;width:100%;border-radius:0}
.fq input:focus,.fq textarea:focus,.fq select:focus{outline:none;border-bottom-color:var(--accent)}
.fq textarea{resize:vertical;min-height:70px}
.choice{display:flex;flex-direction:column;gap:6px}
.choice button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;text-align:left;font-weight:500}
.choice button .k{font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 0;font-family:var(--f-num);font-weight:600}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ferr{color:var(--late);font-size:13px;font-weight:600}
.fprog{height:4px;background:var(--sunk)} .fprog span{display:block;height:100%;background:var(--accent);transition:width .2s}
.convo{min-height:300px;justify-content:center}
.convo .step{font-family:var(--f-num);font-size:12px;color:var(--accent);font-weight:600}
.convo .ql{font-size:20px;font-family:var(--f-display)}
.fnav{display:flex;gap:8px;align-items:center}
.fnav .hint{font-size:12px;color:var(--muted)}
.done-box{text-align:center;padding:40px 24px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done-box b{font-family:var(--f-display);font-size:22px}
.rtbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rtbl table{width:100%;min-width:600px;table-layout:auto}
.rtbl th,.rtbl td{height:auto;padding:9px 12px;text-align:left;border-right:0;background:transparent;vertical-align:top;font-size:13px}
.rtbl th{border-top:0}
.rtbl td{max-width:280px;white-space:pre-wrap;word-break:break-word}
.notice{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.rchip{border:0;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;flex:none}
.resp dl{margin:0;display:flex;flex-direction:column;gap:8px}
.resp dt{font-size:12px;color:var(--muted);font-weight:600}
.resp dd{margin:0;white-space:pre-wrap}
@media (max-width:980px){.feditor{grid-template-columns:minmax(0,1fr)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* cabeçalho */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,30px);line-height:1.05;margin:2px 0 0;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.views{display:flex;gap:2px;border-bottom:1px solid var(--line);width:100%;overflow-x:auto}
.views button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.views button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* barra de ferramentas */
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.split{display:inline-flex;border-radius:8px;overflow:hidden}
.split button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 14px}
.split button+button{border-left:1px solid rgb(255 255 255 / .25);padding:8px 10px}
.tb{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:8px;padding:7px 10px;color:var(--ink);font-weight:500}
.tb:hover,.tb[aria-expanded="true"]{background:var(--sunk)}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .badge{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.search{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;height:34px}
.search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{border:0;background:transparent;outline:none;width:170px;padding:0}
.focus-sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 10px;max-width:220px}
.focus-sel.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

/* quadro */
.board{overflow-x:auto;padding-bottom:6px;display:flex;flex-direction:column;gap:26px}
.grp{--g:#579BFC;min-width:max-content}
.gh{display:flex;align-items:center;gap:8px;padding:0 0 6px;position:sticky;left:0;width:fit-content;max-width:calc(100vw - 40px)}
.gh .caret{border:0;background:transparent;color:var(--g);width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.gh .caret svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;transition:transform .15s}
.grp.closed .gh .caret svg{transform:rotate(-90deg)}
.gname{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--g);border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;min-width:60px;letter-spacing:-.01em}
.gname:hover{border-color:var(--line)} .gname:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.gmeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.gmeta .mini{width:80px;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.gmeta .mini span{display:block;height:100%;background:var(--done)}
.dots3{border:0;background:transparent;color:var(--muted);border-radius:6px;width:28px;height:28px;font-size:18px;line-height:1}
.dots3:hover{background:var(--sunk);color:var(--ink)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:38px;padding:0;background:var(--row)}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);text-align:center;border-top:1px solid var(--line)}
tr:hover>td{background:var(--rowh)}
.c-name{position:sticky;left:0;z-index:2;text-align:left;box-shadow:inset 5px 0 0 var(--g);border-left:0}
th.c-name{border-top-left-radius:8px;padding-left:14px}
tbody tr:last-child td.c-name{border-bottom-left-radius:8px}
.hbtn{border:0;background:transparent;width:100%;height:100%;font-weight:600;color:var(--muted);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn:hover{color:var(--ink);background:var(--sunk)}
.hbtn .s{color:var(--accent);margin-left:4px}
.c-add{width:46px}
.c-add .hbtn{font-size:18px;font-weight:400}
.nm{display:flex;align-items:center;gap:4px;padding:0 6px 0 12px;height:100%}
.exp{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;flex:none}
.exp svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none;transition:transform .15s}
.exp.open svg{transform:rotate(90deg)}
.exp.ghost{visibility:hidden}
.nm-in{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm-in:hover{border-color:var(--line)} .nm-in:focus{outline:none;border-color:var(--accent);background:var(--surface)}

<body>
<div class="login" id="login" hidden><form id="lg-form"><div class="brand"><small>Direcional Mídia</small><h1 style="font-size:26px">Central de <span>Projetos</span></h1></div>
<label>E-mail<input id="lg-email" type="email" autocomplete="username" required></label><label>Senha<input id="lg-pass" type="password" autocomplete="current-password" required></label>
<p class="err" id="lg-msg" role="alert"></p><button id="lg-btn" type="submit">Entrar</button></form></div>

    <div class="mhead"><button class="menubtn" data-act="menu" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h2 id="ptitle">Quadro</h2></div>
    <nav class="views" id="views" aria-label="Visões"></nav>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- configuração padrão ---------- */
const GCOLORS=['#579BFC','#A25DDC','#00A86B','#E8912D','#E2445C','#0B8A8F','#7E5BEF','#C2457A','#5A9E2F','#3F6FD8'];
const LCOLORS=['#8C9AA8','#F2A93B','#E2445C','#00A870','#579BFC','#A25DDC','#3B3F4A','#5B4BD1','#7B8CF5','#8EC5F6','#FF7575','#037F4C'];
const DEFAULT_COLS=[
 {id:'status',nome:'Status',tipo:'label',fixo:1,labels:[{id:'ni',nome:'Não iniciado',cor:'#8C9AA8'},{id:'and',nome:'Em andamento',cor:'#F2A93B'},{id:'trav',nome:'Travado',cor:'#E2445C'},{id:'feito',nome:'Feito',cor:'#00A870',done:1}]},
 {id:'prioridade',nome:'Prioridade',tipo:'label',labels:[{id:'crit',nome:'Crítica',cor:'#3B3F4A'},{id:'alta',nome:'Alta',cor:'#5B4BD1'},{id:'media',nome:'Média',cor:'#7B8CF5'},{id:'baixa',nome:'Baixa',cor:'#8EC5F6'}]},
 {id:'prazo',nome:'Prazo',tipo:'data'},
 {id:'progresso',nome:'Progresso',tipo:'progresso'},
 {id:'criado',nome:'Criado em',tipo:'criado'}];
const TIPOS={label:'Etiquetas (status)',data:'Data',texto:'Texto',numero:'Número'};

let cfg={columns:DEFAULT_COLS,hidden:[]},cfgExists=false;
let grupos={},itens={},ready=false,store=null,pop=null;
let ui={page:'quadro',view:'quadro',q:'',foco:'',filtros:{},atraso:false,sort:null,collapsed:{},expanded:{},form:null,ftab:'editar'};
let secoes={},forms={},resps={},fill={data:{},step:0,done:false,err:''};
try{Object.assign(ui,JSON.parse(localStorage.getItem('cp-ui3')||'{}'))}catch(e){}
if(ui.view==='painel'){ui.view='quadro';ui.page='painel'}
const saveUI=()=>{try{localStorage.setItem('cp-ui3',JSON.stringify(ui))}catch(e){}};

/* ---------- armazenamento: Supabase ---------- */
const SB_URL='https://ftahvdzbyqnvarukytws.supabase.co',SB_KEY='sb_publishable_TRsKX1yVSB8EYPxbaSOFAg_HM8AVpI7';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const PUB=new URLSearchParams(location.search).get('f');
function sbStore(){const cache={},subs={},queue={};let pending=0;
  const emit=c=>(subs[c]||[]).forEach(fn=>fn(Object.entries(cache[c]||{}).map(([id,d])=>({id,d}))));
  const clone=o=>JSON.parse(JSON.stringify(o||{}));
  const run=(key,fn)=>{pending++;const p=(queue[key]||Promise.resolve()).then(fn,fn).then(r=>{if(r&&r.error){console.warn(r.error);toast('Não consegui salvar. Confira a conexão e tente de novo.')}}).finally(()=>pending--);queue[key]=p;return p};
  const put=(c,id)=>run(c+'/'+id,()=>sb.from('docs').upsert({colecao:c,id,dados:cache[c][id]},{onConflict:'user_id,colecao,id'}));
  return{pending:()=>pending,
    async load(){const all=[];let from=0;for(;;){const {data,error}=await sb.from('docs').select('colecao,id,dados').range(from,from+999);if(error){toast('Não consegui carregar seus dados.');console.warn(error);break}all.push(...data);if(data.length<1000)break;from+=1000}
      Object.keys(cache).forEach(k=>delete cache[k]);all.forEach(r=>{(cache[r.colecao]=cache[r.colecao]||{})[r.id]=r.dados});Object.keys(subs).forEach(emit)},
    listen(c,fn){(subs[c]=subs[c]||[]).push(fn)},
    async set(c,id,d){(cache[c]=cache[c]||{})[id]=clone(d);emit(c);return put(c,id)},
    async update(c,id,d){cache[c]=cache[c]||{};cache[c][id]=deepMerge(clone(cache[c][id]),clone(d));emit(c);return put(c,id)},
    async del(c,id){if(cache[c])delete cache[c][id];emit(c);return run(c+'/'+id,()=>sb.from('docs').delete().eq('colecao',c).eq('id',id))}}}
let toastT;function toast(m){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,4000)}
function processPending(){Object.values(resps).filter(r=>r.pendente).forEach(r=>{const f=forms[r.form],d=(f&&f.destino)||{};
  if(d.grupo&&grupos[d.grupo]){const v=(r.dados||{})[d.campo];newItem(d.grupo,v?String(v):`Resposta de ${f.nome}`,{resposta:r.id})}
  store.update('respostas',r.id,{pendente:false}).catch(err)})}
async function boot(){if(PUB){bootPublic();return}
  const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}
  document.getElementById('login').hidden=true;document.querySelector('.shell').hidden=false;
  store=sbStore();
  store.listen('quadro',docs=>{const c=docs.find(x=>x.id==='config');if(c){cfgExists=true;cfg={columns:c.d.columns||DEFAULT_COLS,hidden:c.d.hidden||[]}}render()});
  store.listen('secoes',docs=>{secoes={};docs.forEach(x=>secoes[x.id]={id:x.id,...x.d});render()});
  store.listen('grupos',docs=>{grupos={};docs.forEach(x=>grupos[x.id]={id:x.id,...x.d});render()});
  store.listen('itens',docs=>{itens={};docs.forEach(x=>itens[x.id]={id:x.id,...x.d});render()});
  store.listen('formularios',docs=>{forms={};docs.forEach(x=>forms[x.id]={id:x.id,...x.d});render()});
  store.listen('respostas',docs=>{resps={};docs.forEach(x=>resps[x.id]={id:x.id,...x.d});render()});
  await store.load();ready=true;render();processPending();
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&store.pending()===0&&!document.activeElement.matches('input,textarea,select')){await store.load();processPending()}})}
function showLogin(){document.querySelector('.shell').hidden=true;const L=document.getElementById('login');L.hidden=false;setTimeout(()=>document.getElementById('lg-email').focus(),50)}
document.getElementById('lg-form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('lg-btn'),m=document.getElementById('lg-msg');b.disabled=true;m.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById('lg-email').value.trim(),password:document.getElementById('lg-pass').value});
  b.disabled=false;if(error){m.textContent='E-mail ou senha incorretos.';return}boot()});
async function logout(){await sb.auth.signOut();location.reload()}
/* ---------- formulário público ---------- */
let pubForm=null,pubOwner=null;
async function bootPublic(){document.querySelector('.shell').hidden=true;const P=document.getElementById('public');P.hidden=false;
  const {data,error}=await sb.from('docs').select('id,dados,user_id').eq('colecao','formularios').eq('id',PUB).maybeSingle();
  if(error||!data){P.innerHTML='<div class="pub-wrap"><div class="fill"><div class="band"></div><div class="done-box"><b>Formulário indisponível</b><span class="muted">Este link não existe ou o formulário não está mais aberto.</span></div></div></div>';return}
  pubForm={id:data.id,...data.dados};pubOwner=data.user_id;document.title=pubForm.nome;renderPublic()}
function renderPublic(){const P=document.getElementById('public');const ae=document.activeElement,fid=ae&&ae.id,val=ae&&ae.tagName==='INPUT'?ae.value:null;
  P.innerHTML=`<div class="pub-wrap">${rFill(pubForm,true)}<p class="pub-foot">Direcional Mídia</p></div>`;
  if(fid){const el=document.getElementById(fid);if(el){if(val!=null)el.value=val;el.focus()}}}
async function submitPublic(){const id=uid('r');const row={colecao:'respostas',id,user_id:pubOwner,dados:{form:pubForm.id,criado:new Date().toISOString(),dados:JSON.parse(JSON.stringify(fill.data)),pendente:true}};
  const {error}=await sb.from('docs').insert(row);if(error){fill.err='Não foi possível enviar agora. Tente de novo em instantes.';console.warn(error);renderPublic();return}
  fill.done=true;renderPublic()}
const err=e=>console.warn(e);
function upItem(id,d){const it=itens[id];if(it)deepMerge(it,d);render();store.update('itens',id,d).catch(err)}
function upGroup(id,d){if(grupos[id])Object.assign(grupos[id],d);render();store.update('grupos',id,d).catch(err)}
function saveCfg(){render();store.set('quadro','config',{columns:cfg.columns,hidden:cfg.hidden}).catch(err)}
function deepMerge(a,b){for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)){a[k]=deepMerge(a[k]&&typeof a[k]==='object'?a[k]:{},v)}else a[k]=v}return a}

/* ---------- utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toLocaleDateString('sv-SE');
const fmtD=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'2-digit'}).replace('. de','').replace(' de ',' '):'';
const fmtC=d=>d?new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace(' de ',' ').replace(' de ',' '):'';
function ink(hex){const h=hex.replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));
  return .2126*r+.7152*g+.0722*b>.45?'#17202B':'#FFFFFF'}
const col=id=>cfg.columns.find(c=>c.id===id);
const statusCol=()=>col('status');
const lab=(c,id)=>(c.labels||[]).find(l=>l.id===id);
const isDone=v=>{const l=lab(statusCol(),(v||{}).status);return !!(l&&l.done)};
const subs=it=>Array.isArray(it.subs)?it.subs:[];
function progress(it){const s=subs(it);if(s.length){const d=s.filter(x=>isDone(x.valores)).length;return d/s.length*100}return isDone(it.valores)?100:0}
const isLate=(v)=>{const p=(v||{}).prazo;return p&&p<today()&&!isDone(v)};
const visibleCols=()=>cfg.columns.filter(c=>!cfg.hidden.includes(c.id));
const sSorted=()=>{const L=Object.values(secoes).sort((a,b)=>(a.ordem||0)-(b.ordem||0));return L.length?L:[{id:'sproj',nome:'Projetos',ordem:1,virtual:1}]};
const secOf=g=>{const L=sSorted();return L.find(x=>x.id===g.secao)?g.secao:L[0].id};
const gSorted=()=>{const S=sSorted().map(x=>x.id);return Object.values(grupos).sort((a,b)=>S.indexOf(secOf(a))-S.indexOf(secOf(b))||(a.ordem||0)-(b.ordem||0))};
const itemsOf=g=>Object.values(itens).filter(i=>i.grupo===g);

/* ---------- filtro, busca e ordenação ---------- */
function passFilters(it){const v=it.valores||{};
  for(const [cid,set] of Object.entries(ui.filtros)){if(!set||!set.length)continue;if(!set.includes(v[cid]||'__vazio'))return false}
  if(ui.atraso&&!isLate(v))return false;return true}
function sortVal(it,cid){const v=(it.valores||{})[cid],c=col(cid);
  if(cid==='__nome')return (it.nome||'').toLowerCase();

  return `<div class="fill"><div class="band"></div><div class="inner"><h3>${esc(f.nome)}</h3>${f.descricao?`<p class="desc">${esc(f.descricao)}</p>`:''}

   ${live&&fill.err?`<span class="ferr">${esc(fill.err)}</span>`:''}<div><button class="btn2 pri" data-fsubmit>Enviar</button></div></div></div>`}
function fmtAns(v){return Array.isArray(v)?v.join(', '):v==null?'':String(v)}
function rResps(f){const R=respOf(f.id),C=f.campos||[];

    <td style="white-space:nowrap">${ui.rdel===r.id?`<button class="btn2 danger" data-rdelyes="${r.id}">Excluir</button>`:`<button class="dots3" data-rdel="${r.id}" aria-label="Excluir resposta">×</button>`}</td></tr>`).join('')}</tbody></table></div>`}
function submitForm(f){if(PUB){submitPublic();return}const id=uid('r'),dados=JSON.parse(JSON.stringify(fill.data)),d=f.destino||{};
  store.set('respostas',id,{form:f.id,criado:new Date().toISOString(),dados}).catch(err);resps[id]={id,form:f.id,criado:new Date().toISOString(),dados};
  if(d.grupo&&grupos[d.grupo]){const nome=(d.campo&&dados[d.campo])?String(dados[d.campo]):`Resposta de ${f.nome}`;newItem(d.grupo,nome,{resposta:id})}
  fill.done=true;render()}
function syncInputs(){document.querySelectorAll('[data-fin]').forEach(el=>{fill.data[el.dataset.fin]=el.value})}
function fNext(f){syncInputs();const C=f.campos||[],i=Math.min(fill.step,C.length-1),e=check(C[i]);fill.err=e;if(e){render();return}
  if(i>=C.length-1){submitForm(f);return}fill.step=i+1;render();setTimeout(()=>{const el=document.querySelector('.convo [data-fin]');if(el)el.focus()},40)}
function formClick(t){const f=PUB?pubForm:forms[ui.form];
  if(t.closest('[data-copylink]')){const i=document.getElementById('fe-link');const ok=()=>toast('Link copiado.');try{navigator.clipboard.writeText(i.value).then(ok,()=>{i.select();toast('Selecione e copie o link.')})}catch(e){i.select()}return true}
  const tp=t.closest('[data-tpl]');if(tp){createFromTpl(tp.dataset.tpl);return true}
  const fo=t.closest('[data-fopen]');if(fo){ui.form=fo.dataset.fopen;ui.ftab='editar';resetFill();saveUI();render();return true}
  const ft=t.closest('[data-ftab]');if(ft){ui.ftab=ft.dataset.ftab;resetFill();ui.rdel=null;saveUI();render();return true}
  if(!f)return false;const C=f.campos||[],ix=id=>C.findIndex(c=>c.id===id);
  const aq=t.closest('[data-addq]');if(aq){const tipo=aq.dataset.addq;setCampos(f,[...C,q(tipo,'Nova pergunta',false,HASOPT.includes(tipo)?['Opção 1','Opção 2']:undefined)]);return true}
  const mv=t.closest('[data-qmv]');if(mv){const i=ix(mv.dataset.q),j=i+(+mv.dataset.qmv);if(j<0||j>=C.length)return true;const D=[...C];[D[i],D[j]]=[D[j],D[i]];setCampos(f,D);return true}
  const dp=t.closest('[data-qdup]');if(dp){const i=ix(dp.dataset.qdup),D=[...C];D.splice(i+1,0,{...JSON.parse(JSON.stringify(C[i])),id:uid('q')});setCampos(f,D);return true}
  const dl=t.closest('[data-qdel]');if(dl){setCampos(f,C.filter(c=>c.id!==dl.dataset.qdel));return true}
  const oa=t.closest('[data-optadd]');if(oa){setCampos(f,C.map(c=>c.id===oa.dataset.optadd?{...c,opcoes:[...(c.opcoes||[]),`Opção ${(c.opcoes||[]).length+1}`]}:c));return true}
  const od=t.closest('[data-optdel]');if(od){setCampos(f,C.map(c=>c.id===od.dataset.q?{...c,opcoes:(c.opcoes||[]).filter((_,j)=>j!==+od.dataset.optdel)}:c));return true}
  if(t.closest('[data-fdel]')){ui.fdel=f.id;render();return true} if(t.closest('[data-fdelno]')){ui.fdel=null;render();return true}
  if(t.closest('[data-fdelyes]')){const id=f.id;respOf(id).forEach(r=>{delete resps[r.id];store.del('respostas',r.id).catch(err)});delete forms[id];ui.form=null;ui.fdel=null;saveUI();render();store.del('formularios',id).catch(err);return true}
  const pk=t.closest('[data-fpick]');if(pk){syncInputs();const c=C[ix(pk.dataset.fpick)],v=pk.dataset.v;
    if(c.tipo==='varias'){const s=new Set(fill.data[c.id]||[]);s.has(v)?s.delete(v):s.add(v);fill.data[c.id]=[...s]}else fill.data[c.id]=v;fill.err='';
    if(f.modo==='conversa'&&c.tipo!=='varias'){render();setTimeout(()=>fNext(f),220)}else render();return true}
  if(t.closest('[data-fnext]')){fNext(f);return true} if(t.closest('[data-fprev]')){syncInputs();fill.step=Math.max(0,fill.step-1);fill.err='';render();return true}
  if(t.closest('[data-fsubmit]')){syncInputs();const e=C.map(check).find(Boolean)||'';fill.err=e;if(e){render();return true}submitForm(f);return true}
  if(t.closest('[data-frestart]')){resetFill();render();return true}
  const rd=t.closest('[data-rdel]');if(rd){ui.rdel=rd.dataset.rdel;render();return true}
  const ry=t.closest('[data-rdelyes]');if(ry){const id=ry.dataset.rdelyes;delete resps[id];ui.rdel=null;render();store.del('respostas',id).catch(err);return true}
  return false}
function formChange(t){const d=t.dataset;if(PUB){if(d.fin){fill.data[d.fin]=t.value;return true}return false}const f=forms[ui.form];if(!f||ui.page!=='forms')return false;const C=f.campos||[];
  if(d.ff){const v=d.ff==='nome'?(t.value.trim()||'Formulário sem título'):t.value;upForm(f.id,{[d.ff]:v});return true}
  if(d.qf){setCampos(f,C.map(c=>c.id!==d.q?c:d.qf==='tipo'?{...c,tipo:t.value,...(HASOPT.includes(t.value)&&!(c.opcoes||[]).length?{opcoes:['Opção 1','Opção 2']}:{})}:{...c,rotulo:t.value.trim()||'Pergunta sem título'}));return true}
  if(d.qobrig){setCampos(f,C.map(c=>c.id===d.qobrig?{...c,obrig:t.checked}:c));return true}
  if(d.opt!=null&&d.q){setCampos(f,C.map(c=>c.id===d.q?{...c,opcoes:(c.opcoes||[]).map((o,j)=>j===+d.opt?(t.value.trim()||o):o)}:c));return true}
  if(d.fpub!=null){upForm(f.id,{publico:t.checked});return true}
  if(d.dest){upForm(f.id,{destino:{...(f.destino||{}),[d.dest]:t.value}});return true}
  if(d.fin){fill.data[d.fin]=t.value;return true}
  return false}

function newItem(gid,nome='',extra={}){const g=gid||ui.foco||(gSorted()[0]||{}).id;if(!g){newGroup();return}
  const id=uid('i');const d={grupo:g,nome,ordem:Date.now(),criado:new Date().toISOString(),valores:{status:'ni'},subs:[],...extra};
  itens[id]={id,...d};ui.collapsed[g]=false;render();store.set('itens',id,d).catch(err);return id}
function newGroup(sec){const id=uid('g'),L=gSorted(),sc=sec||(ui.foco&&grupos[ui.foco]?secOf(grupos[ui.foco]):sSorted()[0].id);const d={nome:'Novo projeto',secao:sc,cor:GCOLORS[L.length%GCOLORS.length],ordem:(L[0]?L[0].ordem||0:0)-1,criado:new Date().toISOString()};if(ui.secClosed)ui.secClosed[sc]=false;ui.foco='';
  grupos[id]={id,...d};render();store.set('grupos',id,d).catch(err);setTimeout(()=>{const e=document.getElementById('g-'+id);if(e){e.focus();e.select()}},60)}

  if(subId){const S=subs(it).map(s=>s.id===subId?{...s,valores:{...(s.valores||{}),[cid]:val},...(cid==='status'?{concluidoEm:lab(statusCol(),val)&&lab(statusCol(),val).done?new Date().toISOString():null}:{})}:s);upItem(itemId,{subs:S});return}
  const d={valores:{[cid]:val}};if(cid==='status'){const l=lab(statusCol(),val);d.concluidoEm=l&&l.done?new Date().toISOString():null}upItem(itemId,d)}
function addColumn(nome,tipo){const id='c'+Date.now().toString(36);const c={id,nome:nome||TIPOS[tipo],tipo};
  if(tipo==='label')c.labels=[{id:'l1',nome:'Opção 1',cor:LCOLORS[4]},{id:'l2',nome:'Opção 2',cor:LCOLORS[5]},{id:'l3',nome:'Opção 3',cor:LCOLORS[3]}];
